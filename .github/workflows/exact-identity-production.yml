name: Bhajan Aabha — Exact Identity Production Video

on:
  workflow_dispatch:
    inputs:
      video_seconds:
        description: 'Final video duration in seconds (must be divisible by 15)'
        required: false
        default: '180'

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  VIDEO_SECONDS: ${{ inputs.video_seconds }}

jobs:
  build-exact-identity-video:
    name: Generate bhajan and assemble exact approved singer video
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          pip install -q pillow gradio_client requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate configuration BEFORE any generation
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo 'Missing HF_TOKEN'; exit 1; }
          test -s "assets/uks model image.png" || { echo 'Missing committed singer reference'; exit 1; }
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('assets/uks model image.png')
          im = Image.open(p)
          print('REFERENCE=', p)
          print('REFERENCE_SIZE=', im.size)
          assert im.size == (1536, 1024), im.size
          seconds = int(__import__('os').environ.get('VIDEO_SECONDS', '180'))
          assert 180 <= seconds <= 300 and seconds % 15 == 0, seconds
          print('CONFIG_OK seconds=', seconds)
          print('LIGHTNING_AI=DISABLED')
          PY

      - name: Generate audio and assemble final MP4 (NO LIGHTNING)
        run: |
          set -euo pipefail
          if grep -RniE 'lightning_sdk|lightning_ace' app/exact_identity_production.py; then
            echo 'LIGHTNING_REFERENCE_FOUND_UNEXPECTEDLY'
            exit 1
          fi
          python app/exact_identity_production.py

      - name: Verify outputs
        run: |
          set -euo pipefail
          test -s output/bhajan_aabha_exact_identity.mp4
          test -s output/bhajan_source.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/bhajan_aabha_exact_identity.mp4
          echo 'OUTPUT_VALIDATION_OK'
          echo 'LIGHTNING_CALLS_CONFIRMED_DISABLED'

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-exact-identity-production
          path: |
            output/bhajan_aabha_exact_identity.mp4
            output/bhajan_source.mp3
            output/bhajan_aabha_locked_identity_source.png
            output/manifest.json
          if-no-files-found: error
