name: Bhajan Aabha — Production (Kaggle Free GPU)

on:
  schedule:
    - cron: '30 21 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      video_seconds:
        description: 'Final video duration (180-300 seconds, divisible by 15)'
        required: false
        default: '180'
        type: string
      publish_youtube:
        description: 'Publish the generated MP4 to YouTube'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bhajan-aabha-production
  cancel-in-progress: false

env:
  KAGGLE_USERNAME: 'bhjanaabha'
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN3 }}
  KAGGLE_API_TOKEN3: ${{ secrets.KAGGLE_API_TOKEN3 }}
  KAGGLE_OWNER: 'bhjanaabha'
  KAGGLE_DATASET: 'bhjanaabha/bhajan-aabha-production-output'
  VIDEO_SECONDS: ${{ inputs.video_seconds || '180' }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  production:
    name: Generate on Kaggle free GPU and assemble final MP4
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip pillow kagglehub
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'MISSING_KAGGLE_API_TOKEN'; exit 1; }
          test -s 'assets/uks model image.png' || { echo 'MISSING_APPROVED_SINGER_ASSET'; exit 1; }
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          p = Path('assets/uks model image.png')
          im = Image.open(p)
          print('REFERENCE=', p)
          print('REFERENCE_SIZE=', im.size)
          if im.size != (1536, 1024):
              raise SystemExit(f'REFERENCE_SIZE_FATAL: {im.size}')
          seconds = int(os.environ.get('VIDEO_SECONDS', '180'))
          if not 180 <= seconds <= 300 or seconds % 15:
              raise SystemExit(f'VIDEO_SECONDS_FATAL: {seconds}')
          print('CONFIG_OK')
          print('GPU_BACKEND=KAGGLE')
          print('TRANSFER=EXISTING_PUBLIC_KAGGLE_DATASET_VIA_KAGGLEHUB')
          print('KAGGLE_DATASET=', os.environ['KAGGLE_DATASET'])
          print('KAGGLE_AUTH_SOURCE=KAGGLE_API_TOKEN3_EXPOSED_AS_KAGGLE_API_TOKEN')
          print('LIGHTNING_AI=DISABLED')
          print('HF_ZEROGPU=DISABLED')
          print('PEXELS=DISABLED')
          print('IDENTITY_REGENERATION=DISABLED')
          PY

      - name: Install Kaggle CLI
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade 'kaggle>=2.2.3'
          kaggle --version

      - name: Prepare unique public Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ.get('GITHUB_RUN_ATTEMPT', '1')
          owner = os.environ['KAGGLE_OWNER']
          slug = f'bhajan-aabha-{run_id}-{attempt}'
          title = f'Bhajan Aabha Run {run_id} Attempt {attempt}'
          seconds = int(os.environ.get('VIDEO_SECONDS', '180'))
          Path('kaggle_kernel/kernel-metadata.json').write_text(json.dumps({
              'id': f'{owner}/{slug}',
              'title': title,
              'code_file': 'worker_v2.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': False,
              'enable_gpu': True,
              'enable_internet': True,
          }, indent=2), encoding='utf-8')
          Path('kaggle_kernel/run_config.json').write_text(json.dumps({
              'video_seconds': seconds,
              'run_id': run_id,
              'run_attempt': attempt,
              'config_version': 8,
          }, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'KAGGLE_KERNEL={owner}/{slug}\n')
          print('KAGGLE_KERNEL=', f'{owner}/{slug}')
          PY
          cat kaggle_kernel/kernel-metadata.json
          cat kaggle_kernel/run_config.json

      - name: Push and run the Kaggle GPU worker
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle_kernel --accelerator NvidiaTeslaT4 -t 6600

      - name: Wait for permanent public Kaggle Dataset via kagglehub
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN3 }}
          KAGGLE_DATASET: ${{ env.KAGGLE_DATASET }}
        run: |
          set -euo pipefail
          rm -rf kaggle_output
          mkdir -p kaggle_output/files
          deadline=$((SECONDS + 6000))
          while true; do
            rm -rf kaggle_output/files
            mkdir -p kaggle_output/files
            set +e
            python - <<'PY'
          import os, shutil
          from pathlib import Path
          import kagglehub
          from kagglehub.config import set_kaggle_api_token

          token = os.environ.get('KAGGLE_API_TOKEN', '').strip()
          if token:
              set_kaggle_api_token(token)

          dataset = os.environ['KAGGLE_DATASET']
          dest = Path('kaggle_output/files')
          try:
              result = kagglehub.dataset_download(
                  dataset,
                  output_dir=str(dest),
                  force_download=True,
              )
              print('KAGGLEHUB_DATASET_PATH=', result)
              src = Path(result)
              if src.exists() and src.resolve() != dest.resolve():
                  for p in src.rglob('*'):
                      if p.is_file():
                          rel = p.relative_to(src)
                          out = dest / rel
                          out.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(p, out)
          except Exception as exc:
              print('KAGGLEHUB_DOWNLOAD_ERROR=', repr(exc))
              raise SystemExit(1)
          PY
            rc=$?
            set -e

            if [ "$rc" -eq 0 ] && [ -s kaggle_output/files/manifest.json ] && [ -s kaggle_output/files/bhajan_source.mp3 ] && [ -s kaggle_output/files/bhajan_aabha_exact_identity.mp4 ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('kaggle_output/files/manifest.json').read_text(encoding='utf-8'))
          expected = os.environ['GITHUB_RUN_ID']
          actual = str(m.get('run_id', ''))
          print('KAGGLE_DATASET_MANIFEST_RUN_ID=', actual)
          print('EXPECTED_RUN_ID=', expected)
          print('KAGGLE_DATASET_MANIFEST_STATUS=', m.get('status'))
          if actual != expected:
              raise SystemExit('RUN_ID_MISMATCH')
          if str(m.get('status', '')).upper() not in {'OK', ''}:
              raise SystemExit('KAGGLE_WORKER_FAILED')
          PY
              break
            fi

            echo "KAGGLEHUB_DATASET_NOT_READY rc=${rc}"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'KAGGLEHUB_DATASET_TRANSFER_TIMEOUT'
              exit 1
            fi
            sleep 60
          done

      - name: Validate downloaded production output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/videos
          cp kaggle_output/files/bhajan_source.mp3 output/bhajan_source.mp3
          cp kaggle_output/files/bhajan_aabha_exact_identity.mp4 output/videos/bhajan_aabha_exact_identity.mp4
          cp kaggle_output/files/manifest.json output/manifest.json
          test -s output/bhajan_source.mp3
          test -s output/videos/bhajan_aabha_exact_identity.mp4
          test -s output/manifest.json
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/videos/bhajan_aabha_exact_identity.mp4)
          echo "FINAL_DURATION=$DURATION"
          echo 'OUTPUT_VALIDATION_OK'

      - name: Publish latest production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='bhajan-aabha-latest'
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" \
            --title 'Bhajan Aabha — Latest Production Output' \
            --notes 'Generated on Kaggle free GPU and transferred through the permanent public Kaggle Dataset.' \
            --prerelease \
            output/videos/bhajan_aabha_exact_identity.mp4 \
            output/bhajan_source.mp3 \
            output/manifest.json

      - name: Publish to YouTube
        if: ${{ github.event_name == 'schedule' || inputs.publish_youtube == true }}
        env:
          YOUTUBE_PRIVACY_STATUS: public
          OUTPUT_DIR: output
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_CLIENT_ID:-}" || { echo 'MISSING_YOUTUBE_CLIENT_ID'; exit 1; }
          test -n "${YOUTUBE_CLIENT_SECRET:-}" || { echo 'MISSING_YOUTUBE_CLIENT_SECRET'; exit 1; }
          test -n "${YOUTUBE_REFRESH_TOKEN:-}" || { echo 'MISSING_YOUTUBE_REFRESH_TOKEN'; exit 1; }
          python -u -m app.youtube_publisher_seo output/videos/bhajan_aabha_exact_identity.mp4

      - name: Production summary
        run: |
          echo 'BHAJAN_AABHA_PRODUCTION_OK'
          echo 'BACKEND=KAGGLE_FREE_GPU'
          echo "KAGGLE_KERNEL=$KAGGLE_KERNEL"
          echo "KAGGLE_DATASET=$KAGGLE_DATASET"
          echo 'TRANSFER=EXISTING_PUBLIC_KAGGLE_DATASET_VIA_KAGGLEHUB'
          echo 'AUTH=KAGGLE_API_TOKEN3'
          echo 'LIGHTNING_AI=DISABLED'
          echo 'HF_ZEROGPU=DISABLED'
          echo 'PEXELS=DISABLED'
          echo 'IDENTITY_SOURCE=assets/uks model image.png'
          echo 'FINAL=output/videos/bhajan_aabha_exact_identity.mp4'
