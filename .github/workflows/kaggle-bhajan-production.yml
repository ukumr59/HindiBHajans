name: Bhajan Aabha — Production (Kaggle Free GPU)

on:
  schedule:
    - cron: '30 21 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      video_seconds:
        description: 'Final video duration (180-300 seconds, divisible by 15)'
        required: false
        default: '180'
        type: string
      publish_youtube:
        description: 'Publish the generated MP4 to YouTube'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bhajan-aabha-production
  cancel-in-progress: false

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN2 }}
  KAGGLE_OWNER: 'bhjanaabha'
  VIDEO_SECONDS: ${{ inputs.video_seconds || '180' }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  production:
    name: Generate on Kaggle free GPU and assemble final MP4
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'MISSING_KAGGLE_API_TOKEN2'; exit 1; }
          test -s 'assets/uks model image.png' || { echo 'MISSING_APPROVED_SINGER_ASSET'; exit 1; }
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          p = Path('assets/uks model image.png')
          im = Image.open(p)
          print('REFERENCE=', p)
          print('REFERENCE_SIZE=', im.size)
          if im.size != (1536, 1024):
              raise SystemExit(f'REFERENCE_SIZE_FATAL: {im.size}')
          seconds = int(os.environ.get('VIDEO_SECONDS', '180'))
          if not 180 <= seconds <= 300 or seconds % 15:
              raise SystemExit(f'VIDEO_SECONDS_FATAL: {seconds}')
          print('CONFIG_OK')
          print('GPU_BACKEND=KAGGLE')
          print('KAGGLE_AUTH_SECRET=KAGGLE_API_TOKEN2')
          print('LIGHTNING_AI=DISABLED')
          print('HF_ZEROGPU=DISABLED')
          print('PEXELS=DISABLED')
          print('IDENTITY_REGENERATION=DISABLED')
          PY

      - name: Install Kaggle CLI
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade 'kaggle>=1.8.4'
          kaggle --version

      - name: Prepare unique public Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id = os.environ['GITHUB_RUN_ID']
          owner = os.environ['KAGGLE_OWNER']
          slug = f'bhajan-aabha-run-{run_id}'
          title = f'Bhajan Aabha Run {run_id}'
          seconds = int(os.environ.get('VIDEO_SECONDS', '180'))
          Path('kaggle_kernel/kernel-metadata.json').write_text(json.dumps({
              'id': f'{owner}/{slug}',
              'title': title,
              'code_file': 'worker.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': False,
              'enable_gpu': True,
              'enable_internet': True,
          }, indent=2), encoding='utf-8')
          Path('kaggle_kernel/run_config.json').write_text(json.dumps({
              'video_seconds': seconds,
              'run_id': run_id,
              'config_version': 3,
          }, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'KAGGLE_KERNEL={owner}/{slug}\n')
          print('KAGGLE_KERNEL=', f'{owner}/{slug}')
          print('KAGGLE_TITLE=', title)
          print('KAGGLE_VERSION=1')
          PY
          cat kaggle_kernel/kernel-metadata.json
          cat kaggle_kernel/run_config.json

      - name: Push and run the Kaggle GPU worker
        shell: bash
        run: |
          set -euo pipefail
          echo "PUSHING_KAGGLE_KERNEL=$KAGGLE_KERNEL"
          kaggle kernels push -p kaggle_kernel --accelerator NvidiaTeslaT4 -t 6600

      - name: Wait for Kaggle output without kernels.get
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle_poll
          mkdir -p kaggle_poll
          base="https://www.kaggle.com/api/v1/kernels/output/download/${KAGGLE_KERNEL}"
          deadline=$((SECONDS + 6000))
          while true; do
            rm -f kaggle_poll/manifest.json kaggle_poll/bhajan_source.mp3 kaggle_poll/bhajan_aabha_exact_identity.mp4
            manifest_url="${base}/manifest.json?version_number=1"
            set +e
            curl -fL --retry 2 --connect-timeout 20 --max-time 120 \
              -H "Authorization: Bearer ${KAGGLE_API_TOKEN}" \
              "$manifest_url" -o kaggle_poll/manifest.json
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [ -s kaggle_poll/manifest.json ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('kaggle_poll/manifest.json')
          try:
              m = json.loads(p.read_text(encoding='utf-8'))
          except Exception as exc:
              print('MANIFEST_NOT_JSON=', repr(exc))
              raise SystemExit(2)
          expected = os.environ['GITHUB_RUN_ID']
          actual = str(m.get('run_id', ''))
          print('KAGGLE_MANIFEST_RUN_ID=', actual)
          print('EXPECTED_RUN_ID=', expected)
          print('KAGGLE_MANIFEST_STATUS=', m.get('status'))
          if actual != expected:
              raise SystemExit(3)
          if str(m.get('status', '')).upper() == 'OK':
              raise SystemExit(0)
          if str(m.get('status', '')).upper() in {'ERROR', 'FAILED'}:
              raise SystemExit(4)
          raise SystemExit(5)
          PY
              check=$?
              if [ "$check" -eq 0 ]; then
                break
              fi
              if [ "$check" -eq 4 ]; then
                echo 'KAGGLE_WORKER_FAILED'
                exit 1
              fi
            else
              echo "KAGGLE_OUTPUT_NOT_READY curl_rc=$rc"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'KAGGLE_TIMEOUT_OR_OUTPUT_ACCESS_FAILURE'
              exit 1
            fi
            sleep 60
          done

      - name: Download completed Kaggle outputs without kernels.get
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/videos
          base="https://www.kaggle.com/api/v1/kernels/output/download/${KAGGLE_KERNEL}"
          auth=(-H "Authorization: Bearer ${KAGGLE_API_TOKEN}")
          curl -fL --retry 2 --connect-timeout 20 --max-time 600 "${auth[@]}" "${base}/bhajan_source.mp3?version_number=1" -o output/bhajan_source.mp3
          curl -fL --retry 2 --connect-timeout 20 --max-time 600 "${auth[@]}" "${base}/bhajan_aabha_exact_identity.mp4?version_number=1" -o output/videos/bhajan_aabha_exact_identity.mp4
          cp kaggle_poll/manifest.json output/manifest.json
          test -s output/bhajan_source.mp3 || { echo 'KAGGLE_OUTPUT_FATAL: audio missing'; exit 1; }
          test -s output/videos/bhajan_aabha_exact_identity.mp4 || { echo 'KAGGLE_OUTPUT_FATAL: MP4 missing'; exit 1; }
          test -s output/manifest.json || { echo 'KAGGLE_OUTPUT_FATAL: manifest missing'; exit 1; }
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/videos/bhajan_aabha_exact_identity.mp4)
          echo "FINAL_DURATION=$DURATION"
          echo 'OUTPUT_VALIDATION_OK'

      - name: Publish latest production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='bhajan-aabha-latest'
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" \
            --title 'Bhajan Aabha — Latest Production Output' \
            --notes 'Generated on Kaggle free GPU. Approved singer reference preserved; Lightning AI and HF ZeroGPU are disabled.' \
            --prerelease \
            output/videos/bhajan_aabha_exact_identity.mp4 \
            output/bhajan_source.mp3 \
            output/manifest.json

      - name: Publish to YouTube
        if: ${{ github.event_name == 'schedule' || inputs.publish_youtube == true }}
        env:
          YOUTUBE_PRIVACY_STATUS: public
          OUTPUT_DIR: output
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_CLIENT_ID:-}" || { echo 'MISSING_YOUTUBE_CLIENT_ID'; exit 1; }
          test -n "${YOUTUBE_CLIENT_SECRET:-}" || { echo 'MISSING_YOUTUBE_CLIENT_SECRET'; exit 1; }
          test -n "${YOUTUBE_REFRESH_TOKEN:-}" || { echo 'MISSING_YOUTUBE_REFRESH_TOKEN'; exit 1; }
          python -u -m app.youtube_publisher_seo output/videos/bhajan_aabha_exact_identity.mp4

      - name: Production summary
        run: |
          echo 'BHAJAN_AABHA_PRODUCTION_OK'
          echo 'BACKEND=KAGGLE_FREE_GPU'
          echo "KAGGLE_KERNEL=$KAGGLE_KERNEL"
          echo 'AUTH=KAGGLE_API_TOKEN2'
          echo 'LIGHTNING_AI=DISABLED'
          echo 'HF_ZEROGPU=DISABLED'
          echo 'PEXELS=DISABLED'
          echo 'IDENTITY_SOURCE=assets/uks model image.png'
          echo 'FINAL=output/videos/bhajan_aabha_exact_identity.mp4'
