name: Bhajan Aabha — Production (Kaggle Free GPU)

on:
  schedule:
    - cron: '30 21 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      video_seconds:
        description: 'Final video duration (180-300 seconds, divisible by 15)'
        required: false
        default: '180'
        type: string
      publish_youtube:
        description: 'Publish the generated MP4 to YouTube'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bhajan-aabha-production
  cancel-in-progress: false

env:
  KAGGLE_USERNAME: 'bhjanaabha'
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KAGGLE_API_TOKEN2: ${{ secrets.KAGGLE_API_TOKEN2 }}
  KAGGLE_OWNER: 'bhjanaabha'
  VIDEO_SECONDS: ${{ inputs.video_seconds || '180' }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  production:
    name: Generate on Kaggle free GPU and assemble final MP4
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl unzip

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || test -n "${KAGGLE_API_TOKEN2:-}" || { echo 'MISSING_KAGGLE_API_TOKEN'; exit 1; }
          test -s 'assets/uks model image.png' || { echo 'MISSING_APPROVED_SINGER_ASSET'; exit 1; }
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          p = Path('assets/uks model image.png')
          im = Image.open(p)
          print('REFERENCE=', p)
          print('REFERENCE_SIZE=', im.size)
          if im.size != (1536, 1024):
              raise SystemExit(f'REFERENCE_SIZE_FATAL: {im.size}')
          seconds = int(os.environ.get('VIDEO_SECONDS', '180'))
          if not 180 <= seconds <= 300 or seconds % 15:
              raise SystemExit(f'VIDEO_SECONDS_FATAL: {seconds}')
          print('CONFIG_OK')
          print('GPU_BACKEND=KAGGLE')
          print('TRANSFER=PUBLIC_KAGGLE_DATASET_ANONYMOUS_DOWNLOAD')
          print('LIGHTNING_AI=DISABLED')
          print('HF_ZEROGPU=DISABLED')
          print('PEXELS=DISABLED')
          print('IDENTITY_REGENERATION=DISABLED')
          PY

      - name: Install Kaggle CLI
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade 'kaggle>=2.2.3'
          kaggle --version

      - name: Prepare unique public Kaggle dataset
        shell: bash
        run: |
          set -euo pipefail
          slug="bhajan-aabha-run-${GITHUB_RUN_ID}"
          rm -rf transfer_seed
          mkdir -p transfer_seed
          printf 'Bhajan Aabha transfer seed for run %s\n' "$GITHUB_RUN_ID" > transfer_seed/README.txt
          cat > transfer_seed/dataset-metadata.json <<JSON
          {
            "title": "Bhajan Aabha Run ${GITHUB_RUN_ID}",
            "id": "${KAGGLE_OWNER}/${slug}",
            "subtitle": "Automated Bhajan Aabha production transfer",
            "description": "Public transfer dataset for Bhajan Aabha run ${GITHUB_RUN_ID}.",
            "licenses": [{"name": "CC0-1.0"}]
          }
          JSON
          echo "KAGGLE_KERNEL=${KAGGLE_OWNER}/${slug}" >> "$GITHUB_ENV"
          echo "KAGGLE_DATASET=${KAGGLE_OWNER}/${slug}" >> "$GITHUB_ENV"

      - name: Create public Kaggle dataset using an available token
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for token_name in KAGGLE_API_TOKEN KAGGLE_API_TOKEN2; do
            token="${!token_name:-}"
            if [ -z "$token" ]; then
              continue
            fi
            echo "Trying ${token_name} for public dataset creation"
            export KAGGLE_API_TOKEN="$token"
            set +e
            kaggle datasets create -p transfer_seed -u
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "DATASET_CREATE_OK_USING=${token_name}"
              echo "KAGGLE_ACTIVE_TOKEN=$token" >> "$GITHUB_ENV"
              success=1
              break
            fi
            echo "DATASET_CREATE_FAILED_USING=${token_name} rc=${rc}"
          done
          if [ "$success" -ne 1 ]; then
            echo 'PUBLIC_DATASET_CREATE_FAILED'
            exit 1
          fi

      - name: Push and run the Kaggle GPU worker
        shell: bash
        run: |
          set -euo pipefail
          export KAGGLE_API_TOKEN="$KAGGLE_ACTIVE_TOKEN"
          kaggle kernels push -p kaggle_kernel --accelerator NvidiaTeslaT4 -t 6600

      - name: Wait for public Kaggle Dataset and download without datasets.get
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle_output
          mkdir -p kaggle_output
          zip_url="https://www.kaggle.com/api/v1/datasets/download/${KAGGLE_DATASET}?datasetVersionNumber=2"
          deadline=$((SECONDS + 6000))
          while true; do
            rm -f kaggle_output/dataset.zip
            set +e
            curl -fL --retry 2 --connect-timeout 20 --max-time 300 "$zip_url" -o kaggle_output/dataset.zip
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [ -s kaggle_output/dataset.zip ]; then
              rm -rf kaggle_output/files
              mkdir -p kaggle_output/files
              if unzip -tq kaggle_output/dataset.zip >/dev/null 2>&1; then
                unzip -oq kaggle_output/dataset.zip -d kaggle_output/files
              fi
              if [ -s kaggle_output/files/manifest.json ] && [ -s kaggle_output/files/bhajan_source.mp3 ] && [ -s kaggle_output/files/bhajan_aabha_exact_identity.mp4 ]; then
                python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('kaggle_output/files/manifest.json').read_text(encoding='utf-8'))
          expected = os.environ['GITHUB_RUN_ID']
          actual = str(m.get('run_id', ''))
          print('KAGGLE_DATASET_MANIFEST_RUN_ID=', actual)
          print('EXPECTED_RUN_ID=', expected)
          print('KAGGLE_DATASET_MANIFEST_STATUS=', m.get('status'))
          if actual != expected:
              raise SystemExit('RUN_ID_MISMATCH')
          if str(m.get('status', '')).upper() not in {'OK', ''}:
              raise SystemExit('KAGGLE_WORKER_FAILED')
          PY
                break
              fi
            fi
            echo "KAGGLE_PUBLIC_DATASET_NOT_READY rc=${rc}"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'KAGGLE_PUBLIC_DATASET_TRANSFER_TIMEOUT'
              exit 1
            fi
            sleep 60
          done

      - name: Validate downloaded production output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/videos
          cp kaggle_output/files/bhajan_source.mp3 output/bhajan_source.mp3
          cp kaggle_output/files/bhajan_aabha_exact_identity.mp4 output/videos/bhajan_aabha_exact_identity.mp4
          cp kaggle_output/files/manifest.json output/manifest.json
          test -s output/bhajan_source.mp3
          test -s output/videos/bhajan_aabha_exact_identity.mp4
          test -s output/manifest.json
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/videos/bhajan_aabha_exact_identity.mp4)
          echo "FINAL_DURATION=$DURATION"
          echo 'OUTPUT_VALIDATION_OK'

      - name: Publish latest production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='bhajan-aabha-latest'
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" \
            --title 'Bhajan Aabha — Latest Production Output' \
            --notes 'Generated on Kaggle free GPU and transferred through a public Kaggle Dataset.' \
            --prerelease \
            output/videos/bhajan_aabha_exact_identity.mp4 \
            output/bhajan_source.mp3 \
            output/manifest.json

      - name: Publish to YouTube
        if: ${{ github.event_name == 'schedule' || inputs.publish_youtube == true }}
        env:
          YOUTUBE_PRIVACY_STATUS: public
          OUTPUT_DIR: output
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_CLIENT_ID:-}" || { echo 'MISSING_YOUTUBE_CLIENT_ID'; exit 1; }
          test -n "${YOUTUBE_CLIENT_SECRET:-}" || { echo 'MISSING_YOUTUBE_CLIENT_SECRET'; exit 1; }
          test -n "${YOUTUBE_REFRESH_TOKEN:-}" || { echo 'MISSING_YOUTUBE_REFRESH_TOKEN'; exit 1; }
          python -u -m app.youtube_publisher_seo output/videos/bhajan_aabha_exact_identity.mp4

      - name: Production summary
        run: |
          echo 'BHAJAN_AABHA_PRODUCTION_OK'
          echo 'BACKEND=KAGGLE_FREE_GPU'
          echo "KAGGLE_KERNEL=$KAGGLE_KERNEL"
          echo "KAGGLE_DATASET=$KAGGLE_DATASET"
          echo 'TRANSFER=PUBLIC_KAGGLE_DATASET_ANONYMOUS_DOWNLOAD'
          echo 'LIGHTNING_AI=DISABLED'
          echo 'HF_ZEROGPU=DISABLED'
          echo 'PEXELS=DISABLED'
          echo 'IDENTITY_SOURCE=assets/uks model image.png'
          echo 'FINAL=output/videos/bhajan_aabha_exact_identity.mp4'
