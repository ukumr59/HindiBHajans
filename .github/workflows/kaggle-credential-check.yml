name: Kaggle Credential Check

on:
  workflow_dispatch:

jobs:
  check-kaggle-read-access:
    runs-on: ubuntu-latest
    steps:
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Check Kaggle kernels.get access
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN3 || secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Testing Kaggle kernels.get access only; no GPU/audio/video will run."
          kaggle kernels status bhajanaabha/hindibhajans-ace-step-1789124667
          echo "KAGGLE_KERNELS_GET=PASS"
