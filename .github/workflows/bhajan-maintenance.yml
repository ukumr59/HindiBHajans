name: Bhajan Aabha — Maintenance & Provider Health
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
      timezone: 'Asia/Kolkata'
permissions:
  contents: read
concurrency:
  group: bhajan-maintenance
  cancel-in-progress: true
env:
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN3 || secrets.KAGGLE_API_TOKEN }}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install validation tools
        run: python -m pip install -q --upgrade pillow
      - name: Validate production code and identity source
        run: |
          set -euo pipefail
          test -s 'assets/uks model image.png'
          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import py_compile
          from PIL import Image
          from pathlib import Path
          with Image.open('assets/uks model image.png') as im:
              print('IDENTITY_SOURCE_OK=', im.size); assert im.width >= 500 and im.height >= 500
          for p in Path('app').rglob('*.py'): py_compile.compile(str(p), doraise=True)
          print('PYTHON_COMPILE=PASS')
          PY
      - name: Provider configuration health
        run: |
          set -euo pipefail
          command -v kaggle >/dev/null || python -m pip install -q kaggle
          kaggle kernels list --mine --page-size 1 >/dev/null
          echo 'KAGGLE_API_ACCESS=PASS'
          echo 'AUDIO_GPU=Kaggle free NVIDIA T4'
          echo 'VIDEO_GPU=Kaggle free NVIDIA T4'
          echo 'HF_ZEROGPU=DISABLED'
      - name: Architecture summary
        run: |
          echo 'CONTROL_PLANE=GitHub Actions'
          echo 'GPU_BACKEND=Kaggle free GPU + open-source ACE-Step/EchoMimic'
          echo 'IDENTITY=locked uploaded singer image'
          echo 'SINGING=audio-driven singer animation'
          echo 'SHORTS=derived from approved master without second video GPU run'
          echo 'PUBLISH=YouTube + Facebook + Instagram'
          echo 'COST=zero-cost only'
          echo 'HUGGING_FACE_ZEROGPU=REMOVED_FROM_PRODUCTION'
