name: Bhajan Aabha — 3-5 Minute Production

on:
  workflow_dispatch:
    inputs:
      publish_youtube:
        description: 'Publish generated video to YouTube during this manual run'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bhajan-aabha-longform
  cancel-in-progress: true

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  generate-longform:
    name: Generate Bhajan Aabha 3-5 minute video with unique Pexels visuals
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — Lightning GPU credentials
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$LIGHTNING_USER_ID"
          test -n "$LIGHTNING_API_KEY"
          test -n "$PEXELS_API_KEY"
          test -s app/zero_cost_pipeline_v5_5.py
          test -s app/zero_cost_pipeline_stock.py
          test -s app/pexels_stock_visuals.py
          test -s app/visual_qc.py
          test -s app/lightning_ace_step_worker_v2.py
          python3 -m py_compile app/zero_cost_pipeline_v5_4.py app/zero_cost_pipeline_v5_5.py app/zero_cost_pipeline_stock.py app/pexels_stock_visuals.py app/visual_qc.py app/lightning_ace_step_worker_v2.py
          echo 'PRECHECK_OK: Lightning music + Pexels stock visuals + semantic visual QC + no subtitles.'

      - name: Install zero-cost media tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core jq
          command -v ffmpeg
          command -v ffprobe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache Hugging Face CLIP model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bhajan-aabha-clip-${{ runner.os }}-clip-vit-base-patch32-v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt lightning-sdk torch torchvision transformers

      - name: Resolve Lightning membership (no hardcoded username)
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          set -euo pipefail
          M=$(lightning api /v1/memberships)
          echo "$M" | jq -e '.memberships | length > 0' >/dev/null
          TS=$(echo "$M" | jq -r '.memberships[0].name')
          OWNER_TYPE=$(echo "$M" | jq -r '.memberships[0].ownerType')
          OWNER_ID=$(echo "$M" | jq -r '.memberships[0].ownerId')
          echo "LIGHTNING_TEAMSPACE=$TS" >> "$GITHUB_ENV"
          if [ "$OWNER_TYPE" = "user" ]; then
            OWNER=$(lightning api "/v1/users/$OWNER_ID" | jq -r '.name')
            test -n "$OWNER" && test "$OWNER" != "null"
            echo "LIGHTNING_USERNAME=$OWNER" >> "$GITHUB_ENV"
          elif [ "$OWNER_TYPE" = "organization" ] || [ "$OWNER_TYPE" = "org" ]; then
            OWNER=$(lightning api "/v1/orgs/$OWNER_ID" | jq -r '.name')
            test -n "$OWNER" && test "$OWNER" != "null"
            echo "LIGHTNING_ORG=$OWNER" >> "$GITHUB_ENV"
          else
            echo "Unsupported ownerType=$OWNER_TYPE" >&2
            exit 2
          fi
          echo "LIGHTNING_TEAMSPACE resolved: $TS"

      - name: Generate full-length bhajan video with Pexels stock visuals
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_STUDIO: bhajan-aabha-ace-step
          VIDEO_SECONDS: '180'
          OUTPUT_DIR: output
          PYTHONUNBUFFERED: '1'
        run: python -u -m app.zero_cost_pipeline_stock

      - name: Semantic visual quality gate — reject unrelated/religiously wrong scenes
        env:
          HF_HOME: ~/.cache/huggingface
          TRANSFORMERS_CACHE: ~/.cache/huggingface/transformers
        run: |
          set -euo pipefail
          python -u -m app.visual_qc
          test -s output/visual_qc.json
          grep -q '"passed": true' output/visual_qc.json

      - name: Validate output
        run: |
          set -euo pipefail
          test -s output/run_state.json
          test -s output/visual_qc.json
          test -s output/pexels_credits.txt
          COUNT=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)
          test "$COUNT" -eq 1
          VIDEO=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | head -1)
          test -s "$VIDEO"
          test -s output/audio/bhajan_source.mp3
          test -s output/audio/bhajan_aabha_dj_master.mp3
          test ! -e output/lyrics.srt
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$VIDEO" | grep -q '720,1280'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO" | grep -q 'aac'
          MUSIC_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/audio/bhajan_source.mp3)
          VIDEO_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          awk -v d="$MUSIC_DURATION" 'BEGIN {exit !(d >= 177 && d <= 305)}'
          awk -v d="$VIDEO_DURATION" 'BEGIN {exit !(d >= 178 && d <= 302)}'
          grep -q '"zero_cost": true' output/run_state.json
          grep -q '"lightning": true' output/run_state.json
          grep -q '"full_length_song": true' output/run_state.json
          grep -q '"scene_count": 12' output/run_state.json
          grep -q '"hindi_subtitles": false' output/run_state.json
          echo "FINAL_VIDEO=$VIDEO" >> "$GITHUB_ENV"
          cat output/visual_qc.json
          cat output/run_state.json

      - name: Persist Pexels no-reuse ledger
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pexels_used.json
          if git diff --cached --quiet; then
            echo 'PEXELS_LEDGER_UNCHANGED'
          else
            git commit -m 'chore: record Pexels clips used by longform Bhajan Aabha'
            git push
          fi

      - name: Publish 3-5 minute production release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="bhajan-aabha-longform"
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" \
            --title "Bhajan Aabha — 3-5 Minute Production" \
            --notes "Full-length devotional video with original ACE-Step music and unique Pexels stock visuals. Hindi subtitles are intentionally disabled. Semantic visual QC passed. Pexels source credits are included." \
            --prerelease output/videos/*.mp4 output/audio/bhajan_source.mp3 output/audio/bhajan_aabha_dj_master.mp3 output/run_state.json output/manifest.json output/pexels_credits.txt output/visual_qc.json

      - name: Publish to YouTube with SEO
        if: ${{ github.event_name == 'schedule' || inputs.publish_youtube == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          OUTPUT_DIR: output
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -u -m app.youtube_publisher_seo "$FINAL_VIDEO"

      - name: Publish status
        run: |
          if [ "${{ inputs.publish_youtube }}" = "true" ]; then
            echo 'Manual run: unique Pexels stock visuals generated, semantic visual QC passed, Hindi subtitles disabled, and SEO-enabled YouTube publication requested.'
          else
            echo 'Manual run: unique Pexels stock visuals generated, semantic visual QC passed, Hindi subtitles disabled; YouTube upload not requested.'
          fi
