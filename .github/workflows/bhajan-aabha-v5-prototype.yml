name: Bhajan Aabha — 3-5 Minute Production

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhajan-aabha-longform
  cancel-in-progress: false

jobs:
  generate-longform:
    name: Generate Bhajan Aabha 3-5 minute video
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e
          test -n "$AGNES_API_KEY" || { echo 'SETUP_REQUIRED: add AGNES_API_KEY as a repository secret.'; exit 2; }
          test -s app/zero_cost_pipeline_v5.py
          test -s app/zero_cost_pipeline_v5_2.py
          test -s app/zero_cost_pipeline_v5_4.py
          python3 -m py_compile app/zero_cost_pipeline_v5.py app/zero_cost_pipeline_v5_2.py app/zero_cost_pipeline_v5_4.py
          grep -q 'gradio_client' requirements.txt
          echo 'PRECHECK_OK: clean zero-cost 3-5 minute architecture; live ACE-Step contract; Agnes visuals.'

      - name: Install zero-cost media tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
          fc-match 'Noto Sans Devanagari' | head -1 || true
          echo 'MEDIA_TOOLS_OK: ffmpeg, ffprobe and Devanagari font are installed.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate full-length bhajan video
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VIDEO_SECONDS: '180'
          OUTPUT_DIR: output
        run: python -m app.zero_cost_pipeline_v5_4

      - name: Validate output
        run: |
          set -e
          test -s output/run_state.json
          COUNT=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)
          test "$COUNT" -eq 1
          VIDEO=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | head -1)
          test -s "$VIDEO"
          test -s output/audio/bhajan_source.mp3
          test -s output/audio/bhajan_aabha_dj_master.mp3
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$VIDEO" | grep -q '720,1280'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO" | grep -q 'aac'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 output/audio/bhajan_aabha_dj_master.mp3 | grep -q 'mp3,48000,2'
          MUSIC_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/audio/bhajan_source.mp3)
          VIDEO_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          awk -v d="$MUSIC_DURATION" 'BEGIN {exit !(d >= 177 && d <= 305)}'
          awk -v d="$VIDEO_DURATION" 'BEGIN {exit !(d >= 178 && d <= 302)}'
          grep -q '"zero_cost": true' output/run_state.json
          grep -q '"kaggle": false' output/run_state.json
          grep -q '"full_length_song": true' output/run_state.json
          grep -q '"scene_count": 12' output/run_state.json
          grep -q '"target_duration_range_sec": "180-300"' output/run_state.json
          grep -q '"music_api_mode": "live_gradio_49_input_contract"' output/run_state.json
          cat output/run_state.json

      - name: Publish 3-5 minute production release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="bhajan-aabha-longform"
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" \
            --title "Bhajan Aabha — 3-5 Minute Production" \
            --notes "Full-length 3-5 minute devotional video. First production target is 180 seconds: one full-length ACE-Step song, 12 x 15-second canonical-deity visual scenes, synchronized Hindi lyrics, and standalone 320k DJ master. Zero-cost architecture: no Kaggle, paid GPU, paid API, or Actions artifact storage." \
            --prerelease output/videos/*.mp4 output/audio/bhajan_source.mp3 output/audio/bhajan_aabha_dj_master.mp3 output/run_state.json output/manifest.json output/lyrics.srt
          echo "LONGFORM_RELEASE=https://github.com/$REPO/releases/tag/$TAG"
