name: Bhajan Automation

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch-cloud-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      kernel_id: ${{ steps.dispatch.outputs.kernel_id }}
      release_tag: ${{ steps.dispatch.outputs.release_tag }}
      secret_dataset_id: ${{ steps.dispatch.outputs.secret_dataset_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dispatcher
        run: pip install -r requirements.txt

      - name: Dispatch remote Kaggle GPU worker
        id: dispatch
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GITHUB_UPLOAD_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m app.dispatch_kaggle

      - name: Wait for GitHub release asset from Kaggle worker
        env:
          RELEASE_TAG: ${{ steps.dispatch.outputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          rm -rf release_output
          mkdir -p release_output
          echo "Waiting for GitHub release asset: ${RELEASE_TAG}"

          for attempt in $(seq 1 60); do
            echo "--- release check ${attempt}/60 ---"
            rm -rf release_output/*
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              if gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern '*.mp4' --dir release_output --clobber >/dev/null 2>&1; then
                MP4="$(find release_output -maxdepth 1 -type f -iname '*.mp4' -print -quit)"
                if [ -n "${MP4}" ]; then
                  echo "GitHub release asset received: ${MP4}"
                  cp "${MP4}" bhajan-aabha-${RUN_ID}.mp4
                  break
                fi
              fi
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "GITHUB_RELEASE_TIMEOUT: no MP4 release asset received within 30 minutes."
              exit 1
            fi
            sleep 30
          done

          ls -lh bhajan-aabha-${RUN_ID}.mp4

      - name: Upload generated video artifact
        uses: actions/upload-artifact@v7
        with:
          name: bhajan-aabha-${{ github.run_id }}
          path: bhajan-aabha-${{ github.run_id }}.mp4
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          archive: false

      - name: Delete temporary GitHub release
        if: always()
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ steps.dispatch.outputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${RELEASE_TAG}" ]; then
            gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
          fi

      - name: Delete temporary Kaggle secret dataset
        if: always()
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DATASET_ID: ${{ steps.dispatch.outputs.secret_dataset_id }}
        run: |
          if [ -z "${DATASET_ID}" ]; then exit 0; fi
          if [ -n "${KAGGLE_API_TOKEN}" ]; then
            export KAGGLE_API_TOKEN
            unset KAGGLE_KEY
          else
            KAGGLE_CONFIG_DIR_PATH="${RUNNER_TEMP}/kaggle-config-delete"
            mkdir -p "${KAGGLE_CONFIG_DIR_PATH}"
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'kaggle-config-delete' / 'kaggle.json'
          p.write_text(json.dumps({'username': os.environ['KAGGLE_USERNAME'], 'key': os.environ['KAGGLE_KEY']}), encoding='utf-8')
          p.chmod(0o600)
          PY
            export KAGGLE_CONFIG_DIR="${KAGGLE_CONFIG_DIR_PATH}"
            unset KAGGLE_KEY
          fi
          kaggle datasets delete "${DATASET_ID}" -y || true
