name: Bhajan Automation

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

# Zero-cost architecture: GitHub runner only. No Kaggle, no paid GPU, no paid API.
# CPU-only and never falls back to the user's computer or a paid service.
permissions:
  contents: read

concurrency:
  group: bhajan-aabha-daily
  cancel-in-progress: false

jobs:
  generate-bhajans:
    name: Generate 1-4 Bhajan Aabha videos
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zero-cost generator dependencies
        run: pip install -r requirements.txt

      - name: Discover trends and generate videos
        env:
          MAX_VIDEOS: '4'
          VIDEO_SECONDS: '30'
          OUTPUT_DIR: output
        run: python -m app.zero_cost_pipeline

      - name: Validate generated outputs
        run: |
          test -s output/run_state.json
          COUNT=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)
          echo "Generated videos: ${COUNT}"
          test "${COUNT}" -ge 1
          test "${COUNT}" -le 4
          cat output/run_state.json

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-${{ github.run_id }}
          path: |
            output/videos/*.mp4
            output/*.json
            output/*.srt
          if-no-files-found: error
          retention-days: 7

      - name: Publish status
        run: |
          echo 'Publishing is intentionally gated until YouTube/Facebook OAuth credentials are configured.'
          echo 'No paid API or paid publishing service is used by this workflow.'
