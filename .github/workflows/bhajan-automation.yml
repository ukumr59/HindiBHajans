name: Bhajan Automation

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

# ZERO-COST architecture: GitHub-hosted runner only. No Kaggle, GPU, paid API, or paid storage.
permissions:
  contents: write

concurrency:
  group: bhajan-aabha-daily
  cancel-in-progress: false

jobs:
  generate-bhajans:
    name: Generate 1-3 Bhajan Aabha videos
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact revision
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          git status --short
          test -s app/zero_cost_pipeline_v2.py

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core espeak-ng espeak-ng-data
          echo "ESPEAK=$(command -v espeak-ng)"
          espeak-ng --version
          espeak-ng --voices | grep -E '(^|[[:space:]])hi([[:space:]]|$)' || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zero-cost generator dependencies
        run: pip install -r requirements.txt

      - name: Generate videos with zero-cost v2 pipeline
        env:
          MAX_VIDEOS: '3'
          VIDEO_SECONDS: '45'
          OUTPUT_DIR: output
        run: python -m app.zero_cost_pipeline_v2

      - name: Validate generated outputs
        run: |
          set -e
          test -s output/run_state.json
          COUNT=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)
          echo "Generated videos: ${COUNT}"
          test "${COUNT}" -ge 1
          test "${COUNT}" -le 3
          for f in output/videos/*.mp4; do
            test -s "$f"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f" | grep -q '720,1280'
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f" | grep -q 'aac'
            ffprobe -v error -select_streams a:0 -show_entries stream=duration -of csv=p=0 "$f" | awk '$1 > 1 {ok=1} END {exit !ok}'
          done
          cat output/run_state.json

      - name: Publish latest videos to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="bhajan-aabha-latest"
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Bhajan Aabha — Latest Output" \
            --notes "Latest zero-cost Bhajan Aabha output. Visuals and Hindi narration are generated locally on the GitHub runner. No Kaggle, paid API, paid GPU, external media download, or Actions artifact storage." \
            --prerelease \
            output/videos/*.mp4 output/*.json
          echo "Release published: https://github.com/$REPO/releases/tag/$TAG"

      - name: Publish status
        run: |
          echo 'YouTube/Facebook publishing remains gated until channel OAuth credentials are configured.'
          echo 'ZERO_COST=true | KAGGLE=false | PAID_SERVICES=false | ACTIONS_ARTIFACTS=false'
          echo 'Video delivery is through the latest GitHub release.'
