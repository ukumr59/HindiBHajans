name: Bhajan Automation

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-cloud-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      kernel_id: ${{ steps.dispatch.outputs.kernel_id }}
      dataset_id: ${{ steps.dispatch.outputs.dataset_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dispatcher
        run: pip install -r requirements.txt

      - name: Dispatch remote Kaggle GPU worker
        id: dispatch
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python -m app.dispatch_kaggle

      - name: Wait for Kaggle dataset output and download MP4
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DATASET_ID: ${{ steps.dispatch.outputs.dataset_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          rm -rf kaggle_output
          mkdir -p kaggle_output
          echo "Waiting for remote worker dataset: ${DATASET_ID}"

          if [ -n "${KAGGLE_API_TOKEN}" ]; then
            export KAGGLE_API_TOKEN
            unset KAGGLE_KEY
          else
            KAGGLE_CONFIG_DIR_PATH="${RUNNER_TEMP}/kaggle-config"
            mkdir -p "${KAGGLE_CONFIG_DIR_PATH}"
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'kaggle-config' / 'kaggle.json'
          p.write_text(json.dumps({
              'username': os.environ['KAGGLE_USERNAME'],
              'key': os.environ['KAGGLE_KEY'],
          }), encoding='utf-8')
          p.chmod(0o600)
          PY
            export KAGGLE_CONFIG_DIR="${KAGGLE_CONFIG_DIR_PATH}"
            unset KAGGLE_KEY
          fi

          for attempt in $(seq 1 60); do
            echo "--- dataset check ${attempt}/60 ---"
            rm -rf kaggle_output/*
            if kaggle datasets download "${DATASET_ID}" -p kaggle_output --unzip -o -q; then
              echo "Dataset download endpoint responded."
            else
              echo "Dataset not ready yet."
            fi

            if [ -f kaggle_output/manifest.json ] && [ -f kaggle_output/run_state.json ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('kaggle_output/manifest.json')
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
              ok = str(data.get('run_id')) == str(os.environ['RUN_ID'])
          except Exception:
              ok = False
          Path('kaggle_output/.correct_run').write_text('yes' if ok else 'no', encoding='utf-8')
          PY
            fi

            if [ -f kaggle_output/.correct_run ] && grep -qx 'yes' kaggle_output/.correct_run && find kaggle_output -type f -iname '*.mp4' -print -quit | grep -q .; then
              echo "Correct MP4 found for this GitHub run."
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "KAGGLE_OUTPUT_TIMEOUT: no matching MP4 dataset produced within 30 minutes."
              find kaggle_output -maxdepth 3 -type f -print || true
              exit 1
            fi
            sleep 30
          done

          echo "Downloaded Kaggle output:"
          find kaggle_output -type f -maxdepth 4 -printf '%p %s bytes\n'
          mkdir -p artifacts
          find kaggle_output -type f \( -iname '*.mp4' -o -iname 'run_state.json' -o -iname '*.srt' -o -iname 'manifest.json' \) -exec cp --parents {} artifacts/ \;

      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Delete temporary Kaggle output dataset
        if: always()
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DATASET_ID: ${{ steps.dispatch.outputs.dataset_id }}
        run: |
          if [ -n "${KAGGLE_API_TOKEN}" ]; then
            export KAGGLE_API_TOKEN
            unset KAGGLE_KEY
          else
            KAGGLE_CONFIG_DIR_PATH="${RUNNER_TEMP}/kaggle-config-delete"
            mkdir -p "${KAGGLE_CONFIG_DIR_PATH}"
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'kaggle-config-delete' / 'kaggle.json'
          p.write_text(json.dumps({'username': os.environ['KAGGLE_USERNAME'], 'key': os.environ['KAGGLE_KEY']}), encoding='utf-8')
          p.chmod(0o600)
          PY
            export KAGGLE_CONFIG_DIR="${KAGGLE_CONFIG_DIR_PATH}"
            unset KAGGLE_KEY
          fi
          kaggle datasets delete "${DATASET_ID}" -y || true
