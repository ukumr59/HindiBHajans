name: Bhajan Automation

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-cloud-worker:
    # Use the standard Ubuntu runner for the controller. ubuntu-slim is
    # intentionally avoided here: it is a lightweight 1-vCPU container with
    # a 15-minute job limit, while this controller can wait up to 30 minutes
    # for the remote Kaggle worker output.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      kernel_id: ${{ steps.dispatch.outputs.kernel_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dispatcher
        run: pip install -r requirements.txt

      - name: Dispatch remote Kaggle GPU worker
        id: dispatch
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python -m app.dispatch_kaggle

      - name: Wait for Kaggle output and download MP4
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KERNEL_ID: ${{ steps.dispatch.outputs.kernel_id }}
        run: |
          set -e
          rm -rf kaggle_output
          mkdir -p kaggle_output
          echo "Waiting for remote worker: ${KERNEL_ID}"

          # Kaggle CLI 2.x does not treat KAGGLE_KEY as an authentication
          # variable. Build the documented legacy kaggle.json explicitly.
          KAGGLE_CONFIG_DIR_PATH="${RUNNER_TEMP}/kaggle-config"
          mkdir -p "${KAGGLE_CONFIG_DIR_PATH}"
          export KAGGLE_CONFIG_DIR_PATH
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['KAGGLE_CONFIG_DIR_PATH']) / 'kaggle.json'
          p.write_text(json.dumps({
              'username': os.environ['KAGGLE_USERNAME'],
              'key': os.environ['KAGGLE_KEY'],
          }), encoding='utf-8')
          p.chmod(0o600)
          PY
          export KAGGLE_CONFIG_DIR="${KAGGLE_CONFIG_DIR_PATH}"
          unset KAGGLE_API_TOKEN KAGGLE_KEY

          for attempt in $(seq 1 60); do
            echo "--- output check ${attempt}/60 ---"
            rm -rf kaggle_output/*
            if kaggle kernels output "${KERNEL_ID}" -p kaggle_output -o -q; then
              echo "Kaggle output endpoint responded using legacy kaggle.json."
            else
              echo "Output not ready yet."
            fi
            if find kaggle_output -type f -iname '*.mp4' -print -quit | grep -q .; then
              echo "MP4 found."
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "KAGGLE_OUTPUT_TIMEOUT: no MP4 produced within 30 minutes."
              find kaggle_output -maxdepth 3 -type f -print || true
              exit 1
            fi
            sleep 30
          done

          echo "Downloaded Kaggle output:"
          find kaggle_output -type f -maxdepth 4 -printf '%p %s bytes\n'
          mkdir -p artifacts
          find kaggle_output -type f \( -iname '*.mp4' -o -iname 'run_state.json' -o -iname '*.srt' \) -exec cp --parents {} artifacts/ \;

      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
