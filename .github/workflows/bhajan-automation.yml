name: Bhajan Automation

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

# Zero-cost architecture: GitHub runner only. No Kaggle, no paid GPU, no paid API.
# Audio is sourced only from public-domain/CC0 packs defined in the generator.
permissions:
  contents: write

concurrency:
  group: bhajan-aabha-daily
  cancel-in-progress: false

jobs:
  generate-bhajans:
    name: Generate 1-3 Bhajan Aabha videos
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zero-cost generator dependencies
        run: pip install -r requirements.txt

      - name: Discover trends and generate videos
        env:
          MAX_VIDEOS: '3'
          VIDEO_SECONDS: '45'
          OUTPUT_DIR: output
        run: python -m app.zero_cost_pipeline

      - name: Validate generated outputs
        run: |
          test -s output/run_state.json
          COUNT=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)
          echo "Generated videos: ${COUNT}"
          test "${COUNT}" -ge 1
          test "${COUNT}" -le 3
          for f in output/videos/*.mp4; do
            test -s "$f"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f" | grep -q '720,1280'
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f" | grep -q 'aac'
          done
          cat output/run_state.json

      - name: Publish latest videos to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="bhajan-aabha-latest"
          echo "Replacing previous $TAG release so storage does not grow indefinitely."
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Bhajan Aabha — Latest Output" \
            --notes "Latest automatically generated Bhajan Aabha videos. Audio is public-domain/CC0; visuals are CC0. Previous release is replaced on each successful run." \
            --prerelease \
            output/videos/*.mp4 output/*.json
          echo "Release published: https://github.com/$REPO/releases/tag/$TAG"

      - name: Publish status
        run: |
          echo 'Publishing to YouTube/Facebook is intentionally gated until channel OAuth credentials are configured.'
          echo 'No paid API, paid GPU, Kaggle, or Actions artifact storage is used.'
          echo 'Video delivery is through the latest GitHub release.'
