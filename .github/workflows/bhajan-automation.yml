name: Bhajan Automation

on:
  schedule:
    - cron: '30 21 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      publish_youtube:
        description: 'Publish generated video to YouTube during this manual run'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bhajan-aabha-daily
  cancel-in-progress: false

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  generate-bhajans:
    name: Generate 1 Bhajan Aabha video
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zero-cost system tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core espeak-ng espeak-ng-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify YouTube OAuth connection
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          python - <<'PY'
          import os
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds = Credentials(token=None, refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'], token_uri='https://oauth2.googleapis.com/token', client_id=os.environ['YOUTUBE_CLIENT_ID'], client_secret=os.environ['YOUTUBE_CLIENT_SECRET'], scopes=['https://www.googleapis.com/auth/youtube.upload'])
          creds.refresh(Request())
          youtube = build('youtube', 'v3', credentials=creds, cache_discovery=False)
          items = youtube.channels().list(part='id,snippet', mine=True).execute().get('items', [])
          if not items:
              raise SystemExit('YOUTUBE_AUTH_FAILED: no accessible YouTube channel')
          print('YOUTUBE_CONNECTION_OK')
          print('YOUTUBE_CHANNEL_TITLE=' + items[0]['snippet']['title'])
          PY

      - name: Generate exactly one video with resilient v5.5 pipeline
        env:
          MAX_VIDEOS: '1'
          VIDEO_SECONDS: '45'
          OUTPUT_DIR: output
        run: python -m app.zero_cost_pipeline_v5_5

      - name: Validate generated output
        run: |
          set -euo pipefail
          test -s output/run_state.json
          COUNT=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)
          echo "Generated videos: $COUNT"
          test "$COUNT" -eq 1
          VIDEO=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | head -1)
          test -s "$VIDEO"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$VIDEO" | grep -q '720,1280'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO" | grep -q 'aac'

      - name: Publish latest video to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="bhajan-aabha-latest"
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" --title "Bhajan Aabha — Latest Output" --notes "Zero-cost Bhajan Aabha output." --prerelease output/videos/*.mp4 output/*.json

      - name: Publish to YouTube
        if: ${{ github.event_name == 'schedule' || inputs.publish_youtube == true }}
        env:
          YOUTUBE_PRIVACY_STATUS: public
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          VIDEO=$(find output/videos -maxdepth 1 -type f -name '*.mp4' | head -1)
          python -u -m app.youtube_publisher "$VIDEO"

      - name: Publish status
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'Scheduled run: one video generated and YouTube publication enabled.'
          elif [ "${{ inputs.publish_youtube }}" = "true" ]; then
            echo 'Manual run: one video generated and YouTube publication enabled.'
          else
            echo 'Manual run: one video generated; YouTube upload skipped.'
          fi
