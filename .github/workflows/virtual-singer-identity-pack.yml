name: Bhajan Aabha — Build Virtual Singer Identity Pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-pack:
    name: Generate same singer in 4 controlled views on T4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lightning SDK
        run: pip install -q lightning-sdk

      - name: Resolve Lightning membership
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          set -euo pipefail
          M=$(lightning api /v1/memberships)
          TS=$(echo "$M" | jq -r '.memberships[0].name')
          OWNER_TYPE=$(echo "$M" | jq -r '.memberships[0].ownerType')
          OWNER_ID=$(echo "$M" | jq -r '.memberships[0].ownerId')
          echo "LIGHTNING_TEAMSPACE=$TS" >> "$GITHUB_ENV"
          if [ "$OWNER_TYPE" = "user" ]; then
            OWNER=$(lightning api "/v1/users/$OWNER_ID" | jq -r '.name')
            echo "LIGHTNING_USERNAME=$OWNER" >> "$GITHUB_ENV"
          else
            OWNER=$(lightning api "/v1/orgs/$OWNER_ID" | jq -r '.name')
            echo "LIGHTNING_ORG=$OWNER" >> "$GITHUB_ENV"
          fi

      - name: Generate identity pack on T4
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_TEAMSPACE: ${{ env.LIGHTNING_TEAMSPACE }}
          LIGHTNING_USERNAME: ${{ env.LIGHTNING_USERNAME }}
          LIGHTNING_ORG: ${{ env.LIGHTNING_ORG }}
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import os
          from lightning_sdk import Machine, Studio

          owner = os.environ.get('LIGHTNING_USERNAME') or os.environ.get('LIGHTNING_ORG')
          kwargs = dict(name='bhajan-aabha-virtual-singer', teamspace=os.environ['LIGHTNING_TEAMSPACE'], create_ok=True)
          kwargs['user' if os.environ.get('LIGHTNING_USERNAME') else 'org'] = owner
          s = Studio(**kwargs)
          status = str(s.status).lower()
          if 'running' not in status:
              s.start(Machine.T4)
          elif 't4' not in str(s.machine).lower():
              s.switch_machine(Machine.T4)

          # Lightning upload_file paths are relative to the Studio filesystem
          # root (/teamspace/studios/this_studio), not the shell's ~/ directory.
          remote = 'virtual_singer_identity_pack'
          remote_root = f'/teamspace/studios/this_studio/{remote}'
          s.upload_file('app/virtual_singer/generate_master_identity.py', remote_path=f'{remote}/generate_master_identity.py')
          s.upload_file('app/virtual_singer/generate_identity_pack.py', remote_path=f'{remote}/generate_identity_pack.py')
          s.upload_file('app/virtual_singer/identity_config.json', remote_path=f'{remote}/identity_config.json')

          install = (
              'python -m pip install -q --upgrade '
              '"numpy<2" "diffusers==0.31.0" "transformers==4.46.3" '
              '"accelerate==1.0.1" safetensors invisible_watermark pillow'
          )
          command = (
              f'cd {remote_root} && pwd && ls -la && {install} && '
              'python generate_master_identity.py --seed 44031 --steps 24 --output virtual_singer_master.png && '
              'python generate_identity_pack.py --input virtual_singer_master.png --output-dir identity_pack --steps 20 --strength 0.28 --seed 44031'
          )
          out, code = s.run_with_exit_code(command)
          print(out[-40000:], flush=True)
          if code != 0:
              raise SystemExit(code)

          s.download_file(f'{remote}/virtual_singer_master.png', 'output/virtual_singer_master.png')
          for name in ['front', 'three_quarter_left', 'profile', 'waist_up']:
              s.download_file(f'{remote}/identity_pack/{name}.png', f'output/{name}.png')
          s.stop()
          PY

      - name: Validate identity pack
        run: |
          set -euo pipefail
          for f in output/virtual_singer_master.png output/front.png output/three_quarter_left.png output/profile.png output/waist_up.png; do
            test -s "$f"
            file "$f"
          done

      - name: Upload identity pack
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-virtual-singer-identity-pack
          path: output/
          if-no-files-found: error
