name: Bhajan Aabha — Create Virtual Singer Master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-singer-master:
    name: Generate one permanent fictional Bhajan Aabha singer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lightning SDK
        run: pip install -q lightning-sdk

      - name: Validate singer reference secret
        env:
          SINGER_REFERENCE_B64: ${{ secrets.SINGER_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SINGER_REFERENCE_B64:-}" ]; then
            echo "ERROR: SINGER_REFERENCE_B64 is not configured."
            exit 1
          fi
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SINGER_REFERENCE_B64"]
          data = base64.b64decode(raw, validate=True)
          if not data.startswith(b"\x89PNG") and not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit("ERROR: SINGER_REFERENCE_B64 is not a PNG/JPEG image")
          if len(data) > 48 * 1024:
              raise SystemExit("ERROR: decoded reference is larger than the practical GitHub secret limit; use a compressed JPEG reference")
          Path(os.environ["RUNNER_TEMP"] + "/singer_reference.jpg").write_bytes(data)
          print(f"REFERENCE_OK bytes={len(data)}")
          PY

      - name: Resolve Lightning membership
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          set -euo pipefail
          M=$(lightning api /v1/memberships)
          TS=$(echo "$M" | jq -r '.memberships[0].name')
          OWNER_TYPE=$(echo "$M" | jq -r '.memberships[0].ownerType')
          OWNER_ID=$(echo "$M" | jq -r '.memberships[0].ownerId')
          echo "LIGHTNING_TEAMSPACE=$TS" >> "$GITHUB_ENV"
          if [ "$OWNER_TYPE" = "user" ]; then
            OWNER=$(lightning api "/v1/users/$OWNER_ID" | jq -r '.name')
            echo "LIGHTNING_USERNAME=$OWNER" >> "$GITHUB_ENV"
          else
            OWNER=$(lightning api "/v1/orgs/$OWNER_ID" | jq -r '.name')
            echo "LIGHTNING_ORG=$OWNER" >> "$GITHUB_ENV"
          fi

      - name: Generate virtual singer master on T4
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_TEAMSPACE: ${{ env.LIGHTNING_TEAMSPACE }}
          LIGHTNING_USERNAME: ${{ env.LIGHTNING_USERNAME }}
          LIGHTNING_ORG: ${{ env.LIGHTNING_ORG }}
          SINGER_REFERENCE_B64: ${{ secrets.SINGER_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          rm -rf output
          mkdir -p output
          python - <<'PY'
          import os
          from lightning_sdk import Machine, Studio

          owner = os.environ.get('LIGHTNING_USERNAME') or os.environ.get('LIGHTNING_ORG')
          kwargs = dict(name='bhajan-aabha-virtual-singer', teamspace=os.environ['LIGHTNING_TEAMSPACE'], create_ok=True)
          kwargs['user' if os.environ.get('LIGHTNING_USERNAME') else 'org'] = owner
          s = Studio(**kwargs)
          status = str(s.status).lower()
          if 'running' not in status:
              s.start(Machine.T4)
          elif 't4' not in str(s.machine).lower():
              s.switch_machine(Machine.T4)

          remote = 'virtual_singer_master_run_v5'
          studio_root = '/teamspace/studios/this_studio'
          remote_abs = f'{studio_root}/{remote}'
          s.run(f'rm -rf {remote_abs} && mkdir -p {remote_abs}')
          s.upload_file('app/virtual_singer/generate_master_identity.py', remote_path=f'{remote}/generate_master_identity.py')
          s.upload_file('app/virtual_singer/identity_config.json', remote_path=f'{remote}/identity_config.json')
          s.upload_file(os.path.join(os.environ['RUNNER_TEMP'], 'singer_reference.jpg'), remote_path=f'{remote}/reference_input.jpg')

          install = (
              'python -m pip install -q --upgrade '
              '"numpy<2" "diffusers==0.31.0" "transformers==4.46.3" '
              '"accelerate==1.0.1" safetensors invisible_watermark insightface opencv-python-headless'
          )
          command = f'''cd {remote_abs} && {install} && python - <<'PY2'
          import numpy
          import diffusers
          import transformers
          print("ENV_OK", numpy.__version__, diffusers.__version__, transformers.__version__, flush=True)
          PY2
          export SINGER_REFERENCE_PATH=reference_input.jpg
          python generate_master_identity.py --seed 71284 --steps 30 --reference reference_input.jpg --output virtual_singer_master_v3.png
          test -s virtual_singer_master_v3.png
          sha256sum virtual_singer_master_v3.png'''
          out, code = s.run_with_exit_code(command)
          print(out[-30000:], flush=True)
          if code != 0:
              raise SystemExit(code)

          s.download_file(f'{remote}/virtual_singer_master_v3.png', 'output/virtual_singer_master_v3.png')
          s.stop()
          PY

      - name: Validate master image
        run: |
          set -euo pipefail
          test -s output/virtual_singer_master_v3.png
          file output/virtual_singer_master_v3.png

      - name: Upload virtual singer master
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-virtual-singer-master-v3
          path: output/virtual_singer_master_v3.png
          if-no-files-found: error
