name: Bhajan Aabha — Lock Permanent Virtual Singer Identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-singer-identity:
    name: Create approved locked singer source (no face regeneration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install -q Pillow

      - name: Materialize approved singer reference and create locked source
        env:
          SINGER_REFERENCE_B64: ${{ secrets.SINGER_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SINGER_REFERENCE_B64:-}" ]; then
            echo "ERROR: SINGER_REFERENCE_B64 is not configured."
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          import base64
          import io

          raw = base64.b64decode(os.environ['SINGER_REFERENCE_B64'], validate=True)
          image = Image.open(io.BytesIO(raw)).convert('RGB')
          print(f"REFERENCE_SIZE={image.size}")
          if image.size != (1024, 1536):
              raise SystemExit(f"ERROR: expected approved 1024x1536 identity sheet, got {image.size}")
          Path('output').mkdir(exist_ok=True)
          Path('/tmp/reference.bin').write_bytes(raw)
          PY

          python app/virtual_singer/prepare_locked_identity.py \
            --input-b64 "$SINGER_REFERENCE_B64" \
            --output output/bhajan_aabha_locked_identity_source.png

      - name: Validate locked singer identity
        run: |
          set -euo pipefail
          test -s output/bhajan_aabha_locked_identity_source.png
          python - <<'PY'
          from PIL import Image
          p = 'output/bhajan_aabha_locked_identity_source.png'
          im = Image.open(p)
          print(f"LOCKED_IDENTITY_VALID size={im.size} format={im.format}")
          assert im.size == (210, 420)
          PY

      - name: Upload locked singer source
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-locked-singer-identity
          path: output/bhajan_aabha_locked_identity_source.png
          if-no-files-found: error
