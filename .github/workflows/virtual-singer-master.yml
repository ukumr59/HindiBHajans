name: Bhajan Aabha — Create Virtual Singer Master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-singer-master:
    name: Generate one permanent fictional Bhajan Aabha singer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lightning SDK
        run: pip install -q lightning-sdk

      - name: Validate and materialize singer reference
        env:
          SINGER_REFERENCE_B64: ${{ secrets.SINGER_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SINGER_REFERENCE_B64:-}" ]; then
            echo "ERROR: SINGER_REFERENCE_B64 is not configured."
            exit 1
          fi
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SINGER_REFERENCE_B64"]
          data = base64.b64decode(raw, validate=True)
          if not data.startswith(b"\x89PNG") and not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit("ERROR: SINGER_REFERENCE_B64 is not a PNG/JPEG image")
          if len(data) > 48 * 1024:
              raise SystemExit("ERROR: decoded reference is too large; use the compressed JPEG reference")
          path = Path(os.environ["RUNNER_TEMP"]) / "singer_reference.jpg"
          path.write_bytes(data)
          print(f"REFERENCE_OK bytes={len(data)}")
          PY

      - name: Resolve Lightning membership
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          set -euo pipefail
          M=$(lightning api /v1/memberships)
          TS=$(echo "$M" | jq -r '.memberships[0].name')
          OWNER_TYPE=$(echo "$M" | jq -r '.memberships[0].ownerType')
          OWNER_ID=$(echo "$M" | jq -r '.memberships[0].ownerId')
          echo "LIGHTNING_TEAMSPACE=$TS" >> "$GITHUB_ENV"
          if [ "$OWNER_TYPE" = "user" ]; then
            OWNER=$(lightning api "/v1/users/$OWNER_ID" | jq -r '.name')
            echo "LIGHTNING_USERNAME=$OWNER" >> "$GITHUB_ENV"
          else
            OWNER=$(lightning api "/v1/orgs/$OWNER_ID" | jq -r '.name')
            echo "LIGHTNING_ORG=$OWNER" >> "$GITHUB_ENV"
          fi

      - name: Generate virtual singer master on T4
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_TEAMSPACE: ${{ env.LIGHTNING_TEAMSPACE }}
          LIGHTNING_USERNAME: ${{ env.LIGHTNING_USERNAME }}
          LIGHTNING_ORG: ${{ env.LIGHTNING_ORG }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf output
          mkdir -p output
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path
          from lightning_sdk import Machine, Studio

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          run_id = os.environ['GITHUB_RUN_ID']
          bundle_name = f'virtual_singer_bundle_{run_id}.tar.gz'
          bundle = runner_temp / bundle_name
          with tarfile.open(bundle, 'w:gz') as tar:
              tar.add('app/virtual_singer/generate_master_identity.py', arcname='generate_master_identity.py')
              tar.add('app/virtual_singer/identity_config.json', arcname='identity_config.json')
              tar.add(runner_temp / 'singer_reference.jpg', arcname='reference_input.jpg')
          print(f'BUNDLE_OK name={bundle_name} bytes={bundle.stat().st_size}', flush=True)

          owner = os.environ.get('LIGHTNING_USERNAME') or os.environ.get('LIGHTNING_ORG')
          kwargs = dict(name='bhajan-aabha-virtual-singer', teamspace=os.environ['LIGHTNING_TEAMSPACE'], create_ok=True)
          kwargs['user' if os.environ.get('LIGHTNING_USERNAME') else 'org'] = owner
          s = Studio(**kwargs)
          status = str(s.status).lower()
          if 'running' not in status:
              s.start(Machine.T4)
          elif 't4' not in str(s.machine).lower():
              s.switch_machine(Machine.T4)

          remote = f'virtual_singer_master_run_{run_id}'
          s.run(f'rm -rf {remote} && mkdir -p {remote}')

          # Upload a uniquely named archive. Lightning workspaces can retain
          # files from earlier runs, so never search for a generic filename.
          s.upload_file(str(bundle), remote_path=bundle_name)

          install = (
              'python -m pip install -q --upgrade '
              '"numpy<2" "diffusers==0.31.0" "transformers==4.46.3" '
              '"accelerate==1.0.1" safetensors invisible_watermark insightface opencv-python-headless'
          )

          command = f'''set -euo pipefail
          echo "=== LOCATING THIS RUN'S UPLOADED BUNDLE ==="
          BUNDLE=$(find /teamspace/studios/this_studio -type f -name {bundle_name} -print -quit 2>/dev/null || true)
          test -n "$BUNDLE" || {{ echo "ERROR: {bundle_name} was not found after upload"; exit 1; }}
          echo "LOCATED_BUNDLE=$BUNDLE"
          rm -rf {remote}/payload
          mkdir -p {remote}/payload
          tar -xzf "$BUNDLE" -C {remote}/payload
          cd {remote}/payload
          echo "=== BUNDLE CONTENTS ==="
          ls -lh generate_master_identity.py identity_config.json reference_input.jpg
          test -s generate_master_identity.py
          test -s identity_config.json
          test -s reference_input.jpg
          {install}
          python - <<'PY2'
          import numpy
          import diffusers
          import transformers
          print("ENV_OK", numpy.__version__, diffusers.__version__, transformers.__version__, flush=True)
          PY2
          echo "=== RUNNING GENERATOR FROM SAME DIRECTORY AS REFERENCE ==="
          python generate_master_identity.py --seed 71284 --steps 30 --reference reference_input.jpg --output virtual_singer_master_v3.png
          test -s virtual_singer_master_v3.png
          file virtual_singer_master_v3.png
          sha256sum virtual_singer_master_v3.png'''

          out, code = s.run_with_exit_code(command)
          print(out[-30000:], flush=True)
          if code != 0:
              try:
                  s.stop()
              except Exception:
                  pass
              raise SystemExit(code)

          locate_out, locate_code = s.run_with_exit_code(
              f"find /teamspace/studios/this_studio/{remote} -type f -name virtual_singer_master_v3.png -print"
          )
          print(locate_out, flush=True)
          if locate_code != 0:
              raise SystemExit(locate_code)
          candidates = [x.strip() for x in locate_out.splitlines() if x.strip().endswith('/virtual_singer_master_v3.png')]
          if not candidates:
              raise SystemExit('ERROR: generated master image could not be located')
          generated = candidates[-1]
          print(f'GENERATED_MASTER_PATH={generated}', flush=True)
          s.download_file(generated, 'output/virtual_singer_master_v3.png')
          s.stop()
          PY

      - name: Validate master image
        run: |
          set -euo pipefail
          test -s output/virtual_singer_master_v3.png
          file output/virtual_singer_master_v3.png

      - name: Upload virtual singer master
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-virtual-singer-master-v3
          path: output/virtual_singer_master_v3.png
          if-no-files-found: error
