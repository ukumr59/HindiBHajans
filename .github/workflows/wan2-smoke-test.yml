name: Wan2.1 — Free T4 Visual Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wan-smoke:
    name: Generate one Shri Ram scene with Wan2.1 on free T4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lightning SDK
        run: pip install -q lightning-sdk

      - name: Resolve Lightning membership
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          set -euo pipefail
          M=$(lightning api /v1/memberships)
          TS=$(echo "$M" | jq -r '.memberships[0].name')
          OWNER_TYPE=$(echo "$M" | jq -r '.memberships[0].ownerType')
          OWNER_ID=$(echo "$M" | jq -r '.memberships[0].ownerId')
          echo "LIGHTNING_TEAMSPACE=$TS" >> "$GITHUB_ENV"
          if [ "$OWNER_TYPE" = "user" ]; then
            OWNER=$(lightning api "/v1/users/$OWNER_ID" | jq -r '.name')
            echo "LIGHTNING_USERNAME=$OWNER" >> "$GITHUB_ENV"
          else
            OWNER=$(lightning api "/v1/orgs/$OWNER_ID" | jq -r '.name')
            echo "LIGHTNING_ORG=$OWNER" >> "$GITHUB_ENV"
          fi

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Prepare one-scene Wan request
        run: |
          mkdir -p smoke
          cat > smoke/wan_request.json <<'JSON'
          {"scenes":[{"index":1,"seed":20260831,"prompt":"Cinematic devotional scene of Lord Rama standing majestically inside an ancient Hindu temple at sunrise, blue skin, saffron-gold royal garments, golden crown, bow and arrow, glowing diyas, marigold flowers, sacred Hindu temple architecture, warm divine light, reverent peaceful atmosphere, slow gentle camera movement, photorealistic Indian devotional cinema, no text, no subtitles, no mosque, no church, no Islamic architecture."}]}
          JSON

      - name: Generate one Wan2.1 scene on T4
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_TEAMSPACE: ${{ env.LIGHTNING_TEAMSPACE }}
          LIGHTNING_USERNAME: ${{ env.LIGHTNING_USERNAME }}
          LIGHTNING_ORG: ${{ env.LIGHTNING_ORG }}
          WAN_SAMPLE_STEPS: '30'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from lightning_sdk import Machine, Studio

          owner = os.environ.get('LIGHTNING_USERNAME') or os.environ.get('LIGHTNING_ORG')
          kwargs = dict(
              name='bhajan-aabha-ace-step',
              teamspace=os.environ['LIGHTNING_TEAMSPACE'],
              create_ok=True,
          )
          kwargs['user' if os.environ.get('LIGHTNING_USERNAME') else 'org'] = owner
          s = Studio(**kwargs)
          status = str(s.status).lower()
          if 'running' not in status:
              s.start(Machine.T4)
          elif 't4' not in str(s.machine).lower():
              s.switch_machine(Machine.T4)

          # Keep both files together so the worker can resolve wan_request.json
          # relative to its own location, regardless of the Studio working dir.
          remote_dir = 'wan2_smoke_input'
          s.upload_file('app/lightning_wan2_worker.py', remote_path=f'{remote_dir}/lightning_wan2_worker.py')
          s.upload_file('smoke/wan_request.json', remote_path=f'{remote_dir}/wan_request.json')

          locate, locate_code = s.run_with_exit_code(
              "find /teamspace/studios -maxdepth 4 -type f "
              "\\( -name lightning_wan2_worker.py -o -name wan_request.json \\) -print"
          )
          print('WAN_REMOTE_FILES:')
          print(locate)
          if locate_code != 0:
              raise SystemExit(locate_code)

          worker_candidates = [
              line.strip() for line in locate.splitlines()
              if line.strip().endswith('/lightning_wan2_worker.py')
          ]
          if not worker_candidates:
              raise RuntimeError('WAN_UPLOAD_FATAL: lightning_wan2_worker.py not found after upload')
          worker = worker_candidates[-1]
          print(f'WAN_WORKER_PATH={worker}')

          out, code = s.run_with_exit_code(f'python {worker}')
          print(out[-30000:])
          if code != 0:
              raise SystemExit(code)

          worker_root = str(Path(worker).parent)
          s.download_file(f'{worker_root}/wan2_worker/scenes/scene_1.mp4', 'smoke/wan2_scene.mp4')
          s.download_file(f'{worker_root}/wan2_worker/wan_manifest.json', 'smoke/wan_manifest.json')
          s.stop()
          PY

      - name: Validate smoke output
        run: |
          set -euo pipefail
          test -s smoke/wan2_scene.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 smoke/wan2_scene.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 smoke/wan2_scene.mp4

      - name: Upload smoke-test video
        uses: actions/upload-artifact@v4
        with:
          name: wan2-shri-ram-smoke-test
          path: smoke/wan2_scene.mp4
          if-no-files-found: error
