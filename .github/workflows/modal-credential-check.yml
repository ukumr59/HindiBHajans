name: Modal Credential Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-modal-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_ENVIRONMENT: main
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Install Modal CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade modal

      - name: Verify Modal credentials without GPU
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          echo "Testing Modal control-plane access only; no GPU function will run."
          modal token info
          modal workspace settings list --json
          modal volume list --json
          echo "MODAL_CONTROL_PLANE=PASS"
