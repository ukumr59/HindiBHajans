name: Bhajan Aabha — Daily Production (Real Singer GPU)

on:
  schedule:
    - cron: '30 22 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      video_seconds:
        description: 'Master duration (180-300 seconds, divisible by 15)'
        required: false
        default: '180'
        type: string
      publish:
        description: 'Publish to YouTube, Facebook and Instagram'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: bhajan-daily-production
  cancel-in-progress: false
env:
  VIDEO_SECONDS: ${{ inputs.video_seconds || '180' }}
  MODAL_ENVIRONMENT: main
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
  META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
  META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
  META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
  META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
jobs:
  produce-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: CPU-only production worker integrity gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m py_compile app/modal_audio_worker.py app/modal_video_worker.py app/visual_quality_gate.py
          python - <<'PY'
          from pathlib import Path
          p=Path('app/modal_video_worker.py')
          s=p.read_text()
          checks={
            'sequential_cpu_offload': 'pipeline.enable_sequential_cpu_offload()' in s,
            '65_frame_chunks': 'frames=65' in s and '"--video_length",frames' in s,
            '512x512_profile': '"--sample_size","512","512"' in s,
            'float16_echomimic': '"--weight_dtype","float16"' in s,
            'transformers_pin': 'transformers==4.48.3' in s,
            'diffusers_pin': 'diffusers==0.32.2' in s,
            'wav2vec_patch': 'ECHOMIMIC_WAV2VEC_HIDDEN_STATES_PATCH=PASS' in s,
            'checkpoint_completeness_guard': 'ECHOMIMIC_FLASH_CHECKPOINT_INCOMPLETE' in s and 'strict=False' in s,
          }
          assert all(checks.values()), checks
          print('PRODUCTION_WORKER_INTEGRITY=PASS')
          for k,v in checks.items(): print(f'{k}={v}')
          PY
      - name: Install production tools
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q modal requests pillow google-api-python-client google-auth-oauthlib opencv-python-headless numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download pinned visual-QA models
        run: |
          set -euo pipefail
          mkdir -p qa_models
          curl -L --fail --retry 3 -o qa_models/face_detection_yunet_2023mar.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -L --fail --retry 3 -o qa_models/face_recognition_sface_2021dec.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
          test "$(stat -c%s qa_models/face_detection_yunet_2023mar.onnx)" -gt 100000
          test "$(stat -c%s qa_models/face_recognition_sface_2021dec.onnx)" -gt 10000000
      - name: Hard identity and zero-cost gates
        run: |
          set -euo pipefail
          test -s assets/singer_image.png
          test -n "$MODAL_TOKEN_ID"; test -n "$MODAL_TOKEN_SECRET"
          modal token info
          python - <<'PY'
          import os
          from PIL import Image
          with Image.open('assets/singer_image.png') as im: assert im.width >= 500 and im.height >= 500
          s=int(os.environ.get('VIDEO_SECONDS','180')); assert 180 <= s <= 300 and s % 15 == 0
          print('AUDIO_MODEL=ACE-Step-v1.5-turbo'); print('VIDEO_MODEL=EchoMimicV3-Flash'); print('GPU_BACKEND=MODAL_FREE_T4'); print('IDENTITY_POLICY=LOCKED_REFERENCE'); print('PERFORMANCE_POLICY=REAL_AUDIO_DRIVEN_SINGING'); print('CPU_STATIC_IMAGE_FALLBACK=FORBIDDEN'); print('KAGGLE=DISABLED'); print('HUGGINGFACE_ZEROGPU=DISABLED'); print('PAID_FALLBACK=FORBIDDEN')
          PY
      - name: CPU-only ACE-Step T4 source compatibility preflight
        run: |
          set -euo pipefail
          rm -rf /tmp/ACE-Step-1.5
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git /tmp/ACE-Step-1.5
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('/tmp/ACE-Step-1.5/acestep/core/generation/handler/init_service_orchestrator.py')
          text=p.read_text()
          pattern=re.compile(r'(if\s+gpu_config\.cuda_supports_bfloat16\(\):\s*self\.dtype\s*=\s*torch\.bfloat16\s*else:\s*)self\.dtype\s*=\s*torch\.float16', re.MULTILINE)
          patched,count=pattern.subn(r'\1self.dtype = torch.float32',text,count=1)
          assert count == 1, 'ACE_STEP_SOURCE_LAYOUT_CHANGED: T4 dtype fallback not patchable'
          compile(patched,str(p),'exec')
          assert 'self.dtype = torch.float32' in patched
          print('ACE_STEP_T4_SOURCE_PREFLIGHT=PASS')
          PY
      - name: CPU-only EchoMimicV3 Flash compatibility preflight
        run: |
          set -euo pipefail
          rm -rf /tmp/echomimic_v3_preflight
          git clone --depth 1 https://github.com/antgroup/echomimic_v3.git /tmp/echomimic_v3_preflight
          python - <<'PY'
          import requests
          from pathlib import Path
          worker=Path('app/modal_video_worker.py').read_text()
          assert 'enable_sequential_cpu_offload()' in worker, 'PRODUCTION_WORKER_MEMORY_PATCH_MISSING'
          assert 'frames=65' in worker and '"--video_length",frames' in worker, 'PRODUCTION_WORKER_CHUNK_PROFILE_MISSING'
          assert '"--sample_size","512","512"' in worker, 'PRODUCTION_WORKER_RESOLUTION_PROFILE_MISSING'
          assert 'transformers==4.48.3' in worker and 'diffusers==0.32.2' in worker, 'PRODUCTION_WORKER_RUNTIME_PIN_MISSING'
          assert 'output_hidden_states=True, return_dict=True' in worker, 'PRODUCTION_WORKER_WAV2VEC_PATCH_MISSING'
          assert 'ECHOMIMIC_FLASH_CHECKPOINT_INCOMPLETE' in worker, 'PRODUCTION_WORKER_CHECKPOINT_GUARD_MISSING'
          p=Path('/tmp/echomimic_v3_preflight/infer_flash.py')
          text=p.read_text(); old='pipeline.to(device=device)'; count=text.count(old)
          assert count == 2, f'ECHOMIMIC_MEMORY_LAYOUT_CHANGED: expected 2 pipeline.to calls, found {count}'
          patched=text.replace(old,'pipeline.enable_sequential_cpu_offload()',2); compile(patched,str(p),'exec')
          url='https://huggingface.co/api/models/BadToBest/EchoMimicV3/tree/main/echomimicv3-flash-pro?recursive=false'
          r=requests.get(url,timeout=30); r.raise_for_status(); entries=r.json(); paths={x.get('path') for x in entries if x.get('type')=='file'}
          expected='echomimicv3-flash-pro/diffusion_pytorch_model.safetensors'; assert expected in paths, f'ECHOMIMIC_FLASH_CHECKPOINT_LAYOUT_CHANGED: {expected}'
          print('ECHOMIMIC_MEMORY_PREFLIGHT=PASS sequential_cpu_offload')
          print('ECHOMIMIC_T4_PROFILE_PREFLIGHT=PASS frames=65 sample=512x512')
          print('ECHOMIMIC_RUNTIME_PREFLIGHT=PASS transformers=4.48.3 diffusers=0.32.2')
          print('ECHOMIMIC_WAV2VEC_PREFLIGHT=PASS')
          print('ECHOMIMIC_CHECKPOINT_GUARD_PREFLIGHT=PASS')
          print('ECHOMIMIC_FLASH_CHECKPOINT_PREFLIGHT=PASS')
          PY
      - name: Generate Hindi bhajan audio on Modal free T4
        run: modal run app/modal_audio_worker.py --seconds "$VIDEO_SECONDS"
      - name: Generate real singer video on Modal free T4
        run: modal run app/modal_video_worker.py --seconds "$VIDEO_SECONDS"
      - name: HARD visual identity + singing gate
        run: python -m app.visual_quality_gate output/master.mp4 assets/singer_image.png --yunet qa_models/face_detection_yunet_2023mar.onnx --sface qa_models/face_recognition_sface_2021dec.onnx --report output/visual_qa.json
      - name: Final master gate
        run: |
          set -euo pipefail
          test -s output/master.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 output/master.mp4 | grep -q .
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/master.mp4 | grep -q .
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/master.mp4)
          python - <<PY
          d=float('$DUR'); target=int('$VIDEO_SECONDS'); assert d >= target*0.95, (d,target); print(f'MASTER_GATE=PASS duration={d:.2f}s')
          PY
      - name: Generate Shorts from approved master
        run: |
          set -euo pipefail
          rm -rf output/shorts; mkdir -p output/shorts
          for n in 0 1 2; do start=$((n*45)); ffmpeg -y -v error -ss "$start" -i output/master.mp4 -t 45 -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=20[bg];[0:v]scale=1080:-2:force_original_aspect_ratio=decrease[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2[v]" -map "[v]" -map 0:a:0 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "output/shorts/short-$((n+1)).mp4"; done
      - name: HARD visual gate on every Short
        run: |
          set -euo pipefail
          for f in output/shorts/*.mp4; do python -m app.visual_quality_gate "$f" assets/singer_image.png --yunet qa_models/face_detection_yunet_2023mar.onnx --sface qa_models/face_recognition_sface_2021dec.onnx --report "${f%.mp4}.visual_qa.json"; done
      - name: Final media gate
        run: |
          set -euo pipefail
          for f in output/master.mp4 output/shorts/*.mp4; do test -s "$f"; ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" | grep -q .; ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f" | grep -q .; done
      - name: Upload production files for QA and download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-aabha-production-${{ github.run_id }}
          path: |
            output/master.mp4
            output/bhajan_source.mp3
            output/shorts/*.mp4
            output/visual_qa.json
            output/shorts/*.visual_qa.json
          if-no-files-found: warn
          retention-days: 7
      - name: Create public release assets
        if: ${{ inputs.publish != false }}
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          TAG="bhajan-${GITHUB_RUN_ID}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Bhajan Aabha ${TAG}" --notes "Approved real-singer master + Shorts. Modal free T4 only; visual QA is mandatory." output/master.mp4 output/shorts/*.mp4
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Publish YouTube
        if: ${{ inputs.publish != false }}
        env: { OUTPUT_DIR: output, YOUTUBE_PRIVACY_STATUS: public }
        run: python -u -m app.youtube_publisher_seo output/master.mp4
      - name: Publish Facebook + Instagram independently
        if: ${{ inputs.publish != false }}
        run: |
          set -euo pipefail
          SHORT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/short-1.mp4"
          python -u -m app.meta_publisher --video output/shorts/short-1.mp4 --instagram-url "$SHORT_URL"
      - name: Persist production state
        if: always()
        run: |
          set -euo pipefail
          mkdir -p state
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('state/current.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          d.update({'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow':'bhajan-daily-production','audio_model':'ACE-Step-v1.5-turbo','audio_backend':'MODAL_FREE_T4','video_backend':'MODAL_FREE_T4_ECHOMIMICV3_FLASH','video_model':'EchoMimicV3-Flash','shorts':3,'publishing':'youtube+facebook+instagram' if os.environ.get('RELEASE_TAG') else 'not_run'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state/current.json
          git diff --cached --quiet || git commit -m 'Record latest Bhajan Aabha production state'
          git push
