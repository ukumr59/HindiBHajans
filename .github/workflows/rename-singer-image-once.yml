name: Rename singer asset to canonical filename

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename-singer-asset:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename singer image and update references
        shell: bash
        run: |
          set -euo pipefail
          old='assets/singer image.png'
          new='assets/singer_image.png'

          if [[ ! -f "$old" ]]; then
            echo "Old singer asset is already absent; nothing to rename."
            exit 0
          fi

          # Update textual references before moving the binary asset.
          while IFS= read -r -d '' file; do
            sed -i 's/singer image\.png/singer_image.png/g' "$file"
          done < <(git grep -Il -z -F 'singer image.png' -- ':!assets/singer image.png' || true)

          git mv "$old" "$new"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rename singer image asset to canonical filename'
          git push

      - name: Remove one-time workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          # This step is intentionally informational; the rename commit is made above.
          echo 'Canonical singer asset rename completed.'
